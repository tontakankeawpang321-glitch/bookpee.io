<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InterLib V2 - แยกหมวดหมู่วิดีโอ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        body: ['Sarabun', 'sans-serif'],
                    },
                    colors: {
                        'brand': '#0f172a',
                        'accent': '#2563eb',
                        'fav': '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .bottom-nav { background: #ffffff; border-top: 1px solid #e2e8f0; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #94a3b8; transition: all 0.3s; position: relative; }
        .nav-item.active { color: #2563eb; }
        .nav-item.active::after {
            content: ''; position: absolute; top: -1px; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px; 
            background: #2563eb; border-radius: 0 0 4px 4px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .card-shadow { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); }
        .book-card:active { transform: scale(0.96); }
        
        /* Video Row Styling */
        .video-row { display: flex; overflow-x: auto; gap: 1rem; padding: 0.5rem 0 1.5rem 0; scroll-snap-type: x mandatory; }
        .video-item { flex: 0 0 70%; scroll-snap-align: start; }
        @media (min-width: 640px) { .video-item { flex: 0 0 35%; } }
    </style>
</head>
<body class="font-sans text-slate-800 pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-header">
        <div class="container mx-auto px-4 py-3 flex flex-col items-center gap-3">
            <div class="flex items-center justify-between w-full">
                <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('originals')">
                    <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white text-sm">
                        <i class="fa-solid fa-language"></i>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight uppercase">Inter<span class="text-accent">Lib</span></h1>
                </div>
                <a href="https://sites.google.com/view/bookpeefreer/%E0%B8%AB%E0%B8%99%E0%B8%B2%E0%B9%81%E0%B8%A3%E0%B8%81" target="_blank" class="text-[10px] font-bold text-slate-400 border border-slate-200 px-2 py-1 rounded hover:bg-slate-50 transition-colors uppercase">
                    Privacy Policy
                </a>
            </div>
            
            <div class="relative w-full max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อเรื่อง..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:ring-2 focus:ring-accent outline-none">
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pt-6">
        
        <!-- PAGE: Originals (Books) - 10 Items per Page -->
        <section id="page-originals" class="tab-content">
             <div class="flex flex-col items-center mb-6 text-center">
                <h2 class="font-bold text-xl mb-1 text-slate-900">คลังต้นฉบับ</h2>
                <p class="text-xs text-slate-500">เลือกอ่านฉบับแปลไทย (ทีละ 10 เล่ม)</p>
            </div>

            <div id="grid-originals" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5 min-h-[400px]"></div>

            <div id="pagination-originals" class="flex items-center justify-center gap-4 mt-10">
                <button onclick="changeOriginalsPage(-1)" id="prevBtn" class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-600 flex items-center justify-center shadow-sm disabled:opacity-20 transition-all">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-white px-4 py-2 rounded-full border border-slate-100 shadow-sm">
                    หน้า <span id="currentPageNum" class="text-accent">1</span> / <span id="totalPageNum">1</span>
                </div>
                <button onclick="changeOriginalsPage(1)" id="nextBtn" class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-600 flex items-center justify-center shadow-sm disabled:opacity-20 transition-all">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </section>

        <!-- PAGE: Clips (Videos) - Grouped Rows with Horizontal Scroll -->
        <section id="page-clips" class="tab-content hidden">
            <div class="flex flex-col items-center mb-8 text-center">
                <h2 class="font-bold text-xl mb-1 text-slate-900">วิดีโอสรุปความรู้</h2>
                <div class="text-[9px] text-slate-400 uppercase tracking-widest flex items-center gap-1">
                    <i class="fa-brands fa-youtube text-red-500"></i> Powered by YouTube
                </div>
            </div>

            <div id="video-sections-container">
                <!-- Category Rows generated here -->
            </div>
            
            <div id="empty-clips" class="hidden py-20 text-center text-slate-400">
                <i class="fa-solid fa-clapperboard text-4xl mb-3 opacity-20"></i>
                <p class="text-sm">ไม่พบวิดีโอ</p>
            </div>
        </section>

        <!-- PAGE: Favorites -->
        <section id="page-favorites" class="tab-content hidden">
            <div class="flex flex-col items-center mb-8 text-center">
                <h2 class="font-bold text-xl mb-1 text-fav">รายการโปรด</h2>
                <p class="text-xs text-slate-500">รายการที่คุณบันทึกไว้</p>
            </div>

            <div class="mb-10">
                <h3 class="font-bold text-sm mb-4 px-2 border-l-4 border-accent uppercase tracking-wider">หนังสือที่บันทึกไว้</h3>
                <div id="fav-books-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5"></div>
            </div>

            <div class="mb-10">
                <h3 class="font-bold text-sm mb-4 px-2 border-l-4 border-fav text-fav uppercase tracking-wider">วิดีโอที่บันทึกไว้</h3>
                <div id="fav-videos-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
            </div>
        </section>

    </main>

    <!-- Video Modal -->
    <div id="videoModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/95 p-0 sm:p-4 backdrop-blur-md">
        <div class="relative w-full max-w-4xl aspect-video bg-black shadow-2xl overflow-hidden rounded-none sm:rounded-2xl">
            <button onclick="closeVideoModal()" class="absolute top-4 right-4 text-white/50 text-2xl p-2 hover:text-white z-10 transition-colors">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
            <iframe id="videoIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 w-full bottom-nav z-50">
        <div class="flex justify-around items-center h-16 max-w-lg mx-auto">
            <button onclick="switchTab('originals')" id="nav-originals" class="nav-item active flex-1 h-full flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">คลังต้นฉบับ</span>
            </button>
            <button onclick="switchTab('clips')" id="nav-clips" class="nav-item flex-1 h-full flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-circle-play text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">วิดีโอ</span>
            </button>
            <button onclick="switchTab('favorites')" id="nav-favorites" class="nav-item flex-1 h-full flex flex-col items-center justify-center gap-1">
                <i class="fa-solid fa-heart text-xl"></i>
                <span class="text-[9px] font-bold uppercase tracking-wider">รายการโปรด</span>
            </button>
        </div>
    </nav>

    <script>
        // --- CSV CONFIG ---
        const CSV_ORIGINALS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR5Fum_p5Qqbw58C-SAjYEtXZKbZkdIuVMUQ6B8FYeCTCE7Ra9_MMOjq71N7qLiQyZD8IZK6oNhaKnp/pub?output=csv';
        const CSV_VIDEOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLTwuiIALKLTBYyIEtt9FNjGDgcyAxXAta2qw6kfZsDdtCLcNKRATPGQU3ycCIO2m1a-f4Ax4vYKh1/pub?output=csv';

        let originalsData = [];
        let videosData = [];
        let favorites = JSON.parse(localStorage.getItem('interlib_favs')) || { books: [], videos: [] };
        
        let currentTab = 'originals';
        let originalsPage = 1;
        const itemsPerPage = 10;

        // --- FETCH ---
        async function init() {
            await Promise.all([fetchOriginals(), fetchVideos()]);
            renderOriginals();
            renderClips();
            renderFavorites();
        }

        async function fetchOriginals() {
            try {
                const response = await fetch(CSV_ORIGINALS);
                const text = await response.text();
                originalsData = parseCSV(text);
            } catch (e) { console.error(e); }
        }

        async function fetchVideos() {
            try {
                const response = await fetch(CSV_VIDEOS);
                const text = await response.text();
                videosData = parseCSV(text);
            } catch (e) { console.error(e); }
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const obj = {};
                const currentLine = lines[i].split(',');
                headers.forEach((header, index) => {
                    obj[header] = currentLine[index] ? currentLine[index].trim() : "";
                });
                result.push(obj);
            }
            return result;
        }

        // --- RENDERING ---

        function renderOriginals() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('grid-originals');
            
            const filtered = originalsData.filter(item => 
                (item.title || "").toLowerCase().includes(query) || (item.author || "").toLowerCase().includes(query)
            );

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            const currentBatch = filtered.slice((originalsPage - 1) * itemsPerPage, originalsPage * itemsPerPage);

            document.getElementById('currentPageNum').innerText = originalsPage;
            document.getElementById('totalPageNum').innerText = totalPages;
            document.getElementById('prevBtn').disabled = originalsPage === 1;
            document.getElementById('nextBtn').disabled = originalsPage >= totalPages;

            grid.innerHTML = currentBatch.map(item => createBookCard(item)).join('');
        }

        function createBookCard(item) {
            const isFav = favorites.books.some(f => f.html === item.html);
            return `
                <div class="book-card flex flex-col group relative">
                    <div class="relative overflow-hidden rounded-2xl shadow-sm border border-slate-200 bg-slate-100 aspect-[2/3] cursor-pointer" onclick="openWithTranslate('${item.html}')">
                        <img src="${item.image || 'https://via.placeholder.com/200x300'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <i class="fa-solid fa-language text-white text-3xl"></i>
                        </div>
                    </div>
                    <button onclick="toggleFav('book', '${encodeURIComponent(JSON.stringify(item))}')" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 shadow-sm flex items-center justify-center z-10 transition-all ${isFav ? 'text-fav' : 'text-slate-300'}">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                    </button>
                    <div class="mt-3">
                        <h3 class="text-xs font-bold line-clamp-2 leading-snug font-body">${item.title || 'ไม่มีชื่อ'}</h3>
                        <p class="text-[9px] text-slate-400 mt-1 truncate uppercase tracking-widest">${item.author || 'ไม่ระบุ'}</p>
                    </div>
                </div>
            `;
        }

        function renderClips() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('video-sections-container');
            const emptyState = document.getElementById('empty-clips');
            
            const filtered = videosData.filter(item => 
                (item.title || "").toLowerCase().includes(query) || (item.category || "").toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                container.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            // Group by category
            const grouped = filtered.reduce((acc, item) => {
                const cat = item.category || 'ทั่วไป';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = Object.keys(grouped).map(cat => {
                const clips = grouped[cat];
                return `
                    <div class="category-row-section mb-10">
                        <div class="flex items-center justify-between mb-2 px-1">
                            <h3 class="font-bold text-sm text-slate-800 border-l-4 border-accent pl-2">${cat}</h3>
                            <span class="text-[9px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full uppercase tracking-widest">${clips.length} คลิป</span>
                        </div>
                        <div class="video-row no-scrollbar px-1">
                            ${clips.map(item => createVideoCard(item)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function createVideoCard(item) {
            const videoId = getYTId(item.url);
            const thumb = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : `https://via.placeholder.com/480x270`;
            const isFav = favorites.videos.some(f => f.url === item.url);

            return `
                <div class="video-item bg-white rounded-3xl overflow-hidden shadow-sm group relative border border-slate-100 flex flex-col">
                    <div class="relative aspect-video cursor-pointer overflow-hidden" onclick="playVideo('${item.url}')">
                        <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-black/30 transition-all">
                            <div class="w-10 h-10 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center border border-white/40 shadow-xl">
                                <i class="fa-solid fa-play text-white text-lg ml-1"></i>
                            </div>
                        </div>
                    </div>
                    <button onclick="toggleFav('video', '${encodeURIComponent(JSON.stringify(item))}')" class="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/40 text-white shadow-sm flex items-center justify-center z-10 backdrop-blur-sm transition-all ${isFav ? 'text-fav' : 'text-white/70'}">
                        <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart text-xs"></i>
                    </button>
                    <div class="p-4 flex-grow">
                        <h3 class="font-bold text-slate-800 text-[13px] line-clamp-2 leading-relaxed font-body">${item.title || 'ไม่มีชื่อวิดีโอ'}</h3>
                    </div>
                </div>
            `;
        }

        function renderFavorites() {
            document.getElementById('fav-books-grid').innerHTML = favorites.books.length === 0 
                ? `<p class="col-span-full text-center py-10 text-slate-300 text-xs italic">ยังไม่มีหนังสือที่บันทึกไว้</p>` 
                : favorites.books.map(item => createBookCard(item)).join('');

            document.getElementById('fav-videos-grid').innerHTML = favorites.videos.length === 0 
                ? `<p class="col-span-full text-center py-10 text-slate-300 text-xs italic">ยังไม่มีวิดีโอที่บันทึกไว้</p>` 
                : favorites.videos.map(item => createVideoCard(item)).join('');
        }

        // --- ACTIONS ---

        function toggleFav(type, dataStr) {
            const data = JSON.parse(decodeURIComponent(dataStr));
            if (type === 'book') {
                const idx = favorites.books.findIndex(f => f.html === data.html);
                if (idx > -1) favorites.books.splice(idx, 1); else favorites.books.push(data);
            } else {
                const idx = favorites.videos.findIndex(f => f.url === data.url);
                if (idx > -1) favorites.videos.splice(idx, 1); else favorites.videos.push(data);
            }
            localStorage.setItem('interlib_favs', JSON.stringify(favorites));
            renderOriginals(); renderClips(); renderFavorites();
        }

        function openWithTranslate(url) {
            if (!url) return;
            window.open(`https://translate.google.com/translate?sl=auto&tl=th&u=${encodeURIComponent(url)}`, '_blank');
        }

        function playVideo(url) {
            const videoId = getYTId(url);
            if (videoId) {
                document.getElementById('videoIframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                document.getElementById('videoModal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else window.open(url, '_blank');
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('videoIframe').src = "";
            document.body.style.overflow = '';
        }

        function getYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|\/shorts\/)([^#&?]*).*/;
            const match = (url || "").match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            if(tab === 'originals') originalsPage = 1;
            renderOriginals(); renderClips(); renderFavorites();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeOriginalsPage(offset) {
            originalsPage += offset;
            renderOriginals();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            originalsPage = 1;
            if(currentTab === 'originals') renderOriginals(); 
            else if(currentTab === 'clips') renderClips();
        });

        document.getElementById('videoModal').addEventListener('click', function(e) { if(e.target === this) closeVideoModal(); });

        window.onload = init;
    </script>
</body>
</html>
